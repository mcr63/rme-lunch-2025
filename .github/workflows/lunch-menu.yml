# .github/workflows/lunch-menu.yml
name: Update lunch menu calendar

# DISABLED on a schedule -- this job cannot work on GitHub-hosted runners.
#
# LINQ's load balancer (Server: awselb/2.0) returns a bare 403 Forbidden to
# GitHub's Azure IP ranges before the request ever reaches their application.
# It is an IP-level deny, not a bot check: the identical request with a
# byte-accurate Chrome header set was refused on all 28 attempts, while the
# same request from a home network returns 200 with real menu data.
#
# The menu is now refreshed by a launchd job on the Mac mini, which pushes
# straight to main:
#   ~/.rme-lunch/update-lunch.sh   (installed by install-rme-lunch.sh)
#   launchctl list | grep com.mcr63.rme-lunch
#
# workflow_dispatch is kept so this can still be run by hand -- useful for
# re-testing whether LINQ has since unblocked the runner ranges.
on:
  # schedule:
  #   - cron: "15 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch menu and rebuild ICS
        run: python scripts/update_lunch_menu.py
        env:
          ICS_PATH: RME-Lunch.ics
          CAL_NAME: Rocky Mountain Lunch (RME)
          # If the LINQ WAF blocks the runner's IP (symptom: every chunk 403s),
          # set a LINQ_PROXY repo secret pointing at an egress it accepts.
          LINQ_PROXY: ${{ secrets.LINQ_PROXY }}
          # Override these to point at a different school:
          # LINQ_DISTRICT_ID: ...
          # LINQ_BUILDING_ID: ...

      - name: Commit if changed
        run: |
          if git diff --quiet -- RME-Lunch.ics; then
            echo "No changes."
            exit 0
          fi
          git config user.name "lunch-menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add RME-Lunch.ics
          git commit -m "Update RME lunch menu $(date -u +%F)"
          git push
