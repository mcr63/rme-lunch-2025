# Schedule removed — the LINQ Connect API blocks GitHub-hosted runner IPs.
# The script is now run locally by scripts/run_and_push.sh via launchd
# (~/Library/LaunchAgents/com.mattrobertson.rme-lunch.plist) on weekdays at 6:15 AM.
# Keep workflow_dispatch so a manual trigger from the Actions tab still works
# when run from a non-blocked environment.
name: Update lunch menu calendar

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch menu and rebuild ICS
        run: python scripts/update_lunch_menu.py
        env:
          ICS_PATH: RME-Lunch.ics
          CAL_NAME: Rocky Mountain Lunch (RME)

      - name: Commit if changed
        run: |
          if git diff --quiet -- RME-Lunch.ics; then
            echo "No changes."
            exit 0
          fi
          git config user.name "lunch-menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add RME-Lunch.ics
          git commit -m "Update RME lunch menu $(date -u +%F)"
          git push
